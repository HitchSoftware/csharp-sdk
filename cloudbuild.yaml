steps:
  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: restore
    entrypoint: dotnet
    args:
      - restore
      - ModelContextProtocol.slnx

  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: build-and-pack
    entrypoint: bash
    secretEnv:
      - GITHUB_PACKAGES_PAT
    args:
      - -c
      - |
        set -euo pipefail

        VERSION="${TAG_NAME}"
        mkdir -p ./.artifacts

        for proj in $(find . -name "*.csproj" ! -name "*.Tests.csproj" ! -path "*/obj/*" | sort); do
          echo "Building $proj"
          dotnet build "$proj" -c Release --no-restore
        done

        for proj in $(find . -name "*.csproj" ! -name "*.Tests.csproj" ! -path "*/obj/*" | sort); do
          echo "Packing $proj as ${TAG_NAME}"
          dotnet pack "$proj" -c Release --no-build --no-restore -p:PackageVersion="${TAG_NAME}" -o ./.artifacts
        done

  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: push-packages
    entrypoint: bash
    secretEnv:
      - GITHUB_PACKAGES_PAT
    args:
      - -c
      - |
        set -euo pipefail

        echo "=== Pushing Packages to GitHub Packages via Resilient Curl ==="

        # Loop through all packages, including Core, and upload sequentially
        for nupkg in $$(ls ./.artifacts/*.nupkg | sort); do
          filename=$$(basename "$$nupkg")
          echo "=== Pushing: $$filename ==="
          
          # Using curl bypasses the .NET HttpClient socket reuse deadlock 
          # and handles GCP's MTU packet segmentation flawlessly.
          curl -X PUT \
            -H "Authorization: token $$GITHUB_PACKAGES_PAT" \
            -T "$$nupkg" \
            "https://nuget.pkg.github.com/HitchSoftware/$$(basename $$nupkg)" \
            --fail \
            --show-error \
            --location

          echo "=== Done: $$filename ==="
        done

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HITCH_NUGET_API_KEY/versions/latest
      env: GITHUB_PACKAGES_PAT
