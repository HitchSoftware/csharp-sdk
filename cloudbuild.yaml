steps:
  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: restore
    entrypoint: dotnet
    args:
      - restore
      - ModelContextProtocol.slnx

  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: build-and-pack
    entrypoint: bash
    secretEnv:
      - GITHUB_PACKAGES_PAT
    args:
      - -c
      - |
        set -euo pipefail

        VERSION="${TAG_NAME}"
        mkdir -p ./.artifacts

        for proj in $(find . -name "*.csproj" ! -name "*.Tests.csproj" ! -path "*/obj/*" | sort); do
          echo "Building $proj"
          dotnet build "$proj" -c Release --no-restore
        done

        for proj in $(find . -name "*.csproj" ! -name "*.Tests.csproj" ! -path "*/obj/*" | sort); do
          echo "Packing $proj as ${TAG_NAME}"
          dotnet pack "$proj" -c Release --no-build --no-restore -p:PackageVersion="${TAG_NAME}" -o ./.artifacts
        done

  - name: "mcr.microsoft.com/dotnet/sdk:10.0"
    id: push-packages
    entrypoint: bash
    secretEnv:
      - GITHUB_PACKAGES_PAT
    args:
      - -c
      - |
        set -euo pipefail

        cat > /workspace/nuget.config <<EOF
        <configuration>
          <packageSources>
            <add key="github" value="https://nuget.pkg.github.com/HitchSoftware/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="HitchSoftware" />
              <add key="ClearTextPassword" value="$$GITHUB_PACKAGES_PAT" />
            </github>
          </packageSourceCredentials>
        </configuration>
        EOF

        # Push Core first to test if the hang is Core-specific
        CORE_PKG=$(ls ./.artifacts/*Core*.nupkg)
        echo "=== Pushing Core FIRST: $CORE_PKG ==="
        dotnet nuget push "$CORE_PKG" --source github --configfile /workspace/nuget.config --skip-duplicate
        echo "=== Done Core: $CORE_PKG ==="

        for nupkg in $(ls ./.artifacts/*.nupkg | grep -v Core | sort); do
          echo "=== Pushing: $nupkg ==="
          dotnet nuget push "$nupkg" --source github --configfile /workspace/nuget.config --skip-duplicate
          echo "=== Done: $nupkg ==="
        done

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HITCH_NUGET_API_KEY/versions/latest
      env: GITHUB_PACKAGES_PAT
